<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="manual.pageTitle">Controllo Manuale Irrigazione</title>
    <style>
        /* Apple Glassmorphism Manual Zone Control */
        :root {
            /* Enhanced Color System - Leggibile */
            --color-primary: rgba(64, 162, 235, 0.9);           /* Azzurrino controllo zone */
            --color-primary-light: rgba(64, 162, 235, 0.2);
            --color-primary-gradient: linear-gradient(135deg, rgba(64, 162, 235, 0.9) 0%, rgba(52, 152, 219, 0.85) 100%);
            --color-primary-dark: rgba(52, 139, 199, 0.95);

            --color-secondary: rgba(58, 141, 162, 0.9);         /* Verde-azzurro stato attivo */
            --color-secondary-light: rgba(58, 141, 162, 0.2);
            --color-secondary-gradient: linear-gradient(135deg, rgba(58, 141, 162, 0.9) 0%, rgba(46, 125, 150, 0.85) 100%);
            --color-secondary-dark: rgba(39, 115, 135, 0.95);

            --color-accent: rgba(106, 145, 169, 0.9);           /* Grigio-azzurrino */
            --color-accent-light: rgba(106, 145, 169, 0.2);
            --color-accent-gradient: linear-gradient(135deg, rgba(106, 145, 169, 0.9) 0%, rgba(96, 125, 159, 0.85) 100%);

            /* Enhanced Surface Colors with Gradients */
            --color-surface: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(250, 252, 255, 0.12) 100%);
            --color-surface-light: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(250, 254, 255, 0.18) 100%);
            --color-surface-active: linear-gradient(135deg, rgba(58, 141, 162, 0.15) 0%, rgba(46, 125, 150, 0.12) 100%);   /* Verde-azzurro attivo */
            --color-surface-primary: linear-gradient(135deg, rgba(64, 162, 235, 0.15) 0%, rgba(52, 152, 219, 0.12) 100%); /* Azzurrino selezionate */

            /* Enhanced Text Colors */
            --color-text-headings: rgba(15, 23, 42, 0.95);
            --color-text-body: rgba(30, 41, 59, 0.9);
            --color-text-muted: rgba(96, 125, 139, 0.8);
            --color-text-inverse: rgba(255, 255, 255, 0.98);
            --color-text-success: rgba(27, 94, 32, 0.95);

            /* Status Colors for Zones */
            --color-zone-active: rgba(46, 125, 50, 0.95);
            --color-zone-inactive: rgba(96, 125, 139, 0.6);
            --color-zone-manual: rgba(52, 152, 219, 0.9);
            --color-zone-error: rgba(231, 76, 60, 0.9);

            /* Enhanced Glass Effects */
            --glass-blur: 20px;
            --glass-blur-sm: 12px;
            --glass-blur-lg: 32px;
            --glass-border: 1px solid rgba(255, 255, 255, 0.25);
            --glass-border-accent: 1px solid rgba(52, 152, 219, 0.4);

            /* Enhanced Shadows */
            --shadow-glass-sm: 0 4px 16px rgba(96, 125, 139, 0.08);
            --shadow-glass-md: 0 8px 32px rgba(96, 125, 139, 0.12);
            --shadow-glass-lg: 0 16px 48px rgba(96, 125, 139, 0.16);
            --shadow-zone-active: 0 8px 32px rgba(46, 125, 50, 0.2);

            /* Layout & Typography */
            --radius-xs: 6px;
            --radius-sm: 8px;
            --radius-base: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 50px;

            --transition-duration-fast: 150ms;
            --transition-duration-base: 250ms;
            --transition-easing: cubic-bezier(0.4, 0, 0.2, 1);

            --font-family-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* Zone Control Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg,
                rgba(236, 240, 241, 0.5) 0%,
                rgba(189, 195, 199, 0.4) 25%,
                rgba(149, 165, 166, 0.4) 50%,
                rgba(127, 140, 141, 0.4) 75%,
                rgba(174, 182, 191, 0.5) 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 70%, rgba(46, 125, 50, 0.06) 0%, transparent 50%),
                        radial-gradient(circle at 70% 30%, rgba(52, 152, 219, 0.06) 0%, transparent 50%);
            backdrop-filter: blur(var(--glass-blur-lg)) saturate(110%);
            -webkit-backdrop-filter: blur(var(--glass-blur-lg)) saturate(110%);
            z-index: -1;
            pointer-events: none;
        }

        .page-content-wrapper {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Layout responsive unificato per coerenza */
        .zone-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px; /* Gap unificato con le altre pagine */
            padding: 10px;
        }

        /* Responsive breakpoints coerenti */
        @media (min-width: 768px) {
            .zone-grid-container {
                grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            }
        }

        @media (min-width: 1200px) {
            .zone-grid-container {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 28px;
            }
        }

        /* Glass Card Design */
        .zone-card {
            background: var(--color-surface);
            border: var(--glass-border);
            backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-glass-md);
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all var(--transition-duration-base) var(--transition-easing);
            cursor: default;
            min-height: 320px;
            display: flex;
            flex-direction: column;
        }

        .zone-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--color-accent);
            transform: translateX(-100%);
            transition: transform 0.4s ease;
        }

        .zone-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-glass-lg);
            background: var(--color-surface-light);
        }

        .zone-card:hover::before {
            transform: translateX(0);
        }

        /* Effetti hover già gestiti da .card in global.css */

        .zone-card.active {
            background: var(--color-surface-light);
            border-color: var(--color-accent);
            box-shadow: var(--shadow-glass-lg);
        }
        
        .zone-card.disabled-mode {
            opacity: 0.6;
            pointer-events: none;
            filter: grayscale(70%);
        }
        
        /* Miglioramento del loading indicator per singola card */
        .zone-card.loading-indicator {
            position: relative;
        }

        .zone-card.loading-indicator::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--color-surface-light);
            backdrop-filter: blur(var(--glass-blur-sm));
            z-index: 5;
            border-radius: var(--radius-xl);
        }

        .zone-card.loading-indicator::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin-left: -20px;
            margin-top: -20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid var(--color-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 10;
        }

        /* Global loading indicator for the container */
        .loading-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: var(--color-text-muted);
            grid-column: 1 / -1;
        }

        .loading-indicator::before {
            content: "";
            display: block;
            width: 32px;
            height: 32px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-left-color: var(--color-accent);
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Animazione spin già in global.css */

        .zone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-shrink: 0; /* Non si riduce */
        }

        .zone-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--color-text-headings);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .zone-id {
            font-size: 12px;
            color: var(--color-text-muted);
            font-weight: 500;
            background: var(--color-surface);
            border: var(--glass-border);
            backdrop-filter: blur(var(--glass-blur-sm));
            padding: 6px 12px;
            border-radius: var(--radius-full);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Duration Control */
        .duration-control {
            background: var(--color-surface);
            border: var(--glass-border);
            backdrop-filter: blur(var(--glass-blur-sm));
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 24px;
            flex-shrink: 0; /* Non si riduce */
            box-shadow: var(--shadow-glass-sm);
        }

        .duration-label {
            font-size: 11px;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            margin-bottom: 12px;
            display: block;
            text-align: center;
        }

        .duration-input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .duration-stepper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stepper-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #FFFFFF;
            color: var(--color-primary);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border);
        }

        .stepper-btn:hover:not(:disabled) {
            background: var(--color-primary);
            color: white;
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
            border-color: transparent;
        }

        .stepper-btn:active {
            transform: scale(0.95);
        }

        .stepper-btn:disabled {
            color: var(--color-text-muted);
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--color-surface-dark);
        }

        .duration-input {
            width: 80px;
            height: 48px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: var(--color-text-headings);
            background: var(--color-surface);
            border: var(--glass-border);
            backdrop-filter: blur(var(--glass-blur-sm));
            border-radius: var(--radius-base);
            padding: 8px 12px;
            transition: all var(--transition-duration-fast) ease;
        }

        .duration-input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: var(--shadow-glass-md);
            background: var(--color-surface-light);
        }

        .duration-input::-webkit-inner-spin-button,
        .duration-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .duration-input[type=number] {
            -moz-appearance: textfield;
        }

        .duration-unit {
            font-size: 14px;
            color: var(--color-text-muted);
            font-weight: 500;
            margin-left: -8px;
        }

        /* Circular Progress */
        .progress-container {
            position: relative;
            margin-bottom: 24px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1; /* Occupa lo spazio rimanente */
            min-height: 180px; /* Altezza minima fissa */
        }

        .progress-ring {
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.08));
            transform: rotate(-90deg);
        }

        .progress-ring-bg {
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 8;
        }

        .progress-ring-fill {
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .zone-card.active .progress-ring-fill {
            filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.6));
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .progress-time {
            font-size: 36px;
            font-weight: 700;
            color: var(--color-text-headings);
            display: block;
            letter-spacing: -1px;
        }

        .progress-label {
            font-size: 11px;
            color: var(--color-text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 4px;
        }

        /* Activation Button */
        .activation-button {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0; /* Non si riduce */
            height: 56px; /* Altezza fissa */
        }

        .button-icon {
            width: 16px;
            height: 16px;
        }

        .activation-button.activate {
            background: var(--color-surface);
            border: var(--glass-border);
            backdrop-filter: blur(var(--glass-blur-sm));
            color: var(--color-text-body);
            box-shadow: var(--shadow-glass-sm);
        }

        .activation-button.activate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glass-lg);
            background: var(--color-surface-light);
        }

        .activation-button.deactivate {
            background: var(--color-surface);
            border: var(--glass-border);
            backdrop-filter: blur(var(--glass-blur-sm));
            color: var(--color-text-body);
            box-shadow: var(--shadow-glass-sm);
        }

        .activation-button.deactivate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glass-lg);
            background: var(--color-surface-light);
        }

        .activation-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .activation-button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .button-icon {
            width: 16px;
            height: 16px;
        }


        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 40px;
            background: var(--color-surface);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-glass-md);
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            opacity: 0.5;
        }

        .empty-state-icon svg {
            width: 100%;
            height: 100%;
            color: var(--color-accent);
        }

        .empty-state h3 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--color-text-headings);
        }

        .empty-state p {
            font-size: 16px;
            line-height: 1.6;
            color: var(--color-text-muted);
            margin-bottom: 24px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .zone-grid-container {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            
            .zone-card {
                padding: 18px; /* Padding compatto per mobile */
                min-height: 300px; /* Altezza unificata anche per mobile */
            }
            
            .progress-time {
                font-size: 32px;
            }
            
            .duration-input {
                font-size: 20px;
                width: 70px;
                height: 44px;
            }
        }

        @media (max-width: 480px) {
            .zone-title {
                font-size: 18px;
            }
            
            .progress-time {
                font-size: 28px;
            }
            
            .progress-container {
                height: 160px;
                min-height: 160px;
            }

            .zone-card {
                min-height: 280px; /* Altezza unificata e compatta per mobile piccolo */
            }
        }
    </style>
</head>
<body>
    <div class="page-content-wrapper">
        <div class="manual-page-container">
            <div class="zone-grid-container" id="zone-container">
                <div class="loading-indicator"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Namespace per stato locale
        window.ManualPage = window.ManualPage || {
            zoneStates: new Map() 
        };
    </script>
</body>
</html>
