<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="manual.pageTitle">Controllo Manuale Irrigazione</title>
    <link rel="icon" href="favicon.webp" type="image/webp">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --font-family-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

            --color-primary: rgba(88, 164, 255, 0.92);
            --color-primary-dark: rgba(42, 123, 222, 0.95);
            --color-primary-light: rgba(88, 164, 255, 0.18);
            --color-primary-gradient: linear-gradient(135deg, rgba(88, 164, 255, 0.9) 0%, rgba(42, 123, 222, 0.85) 100%);

            --color-secondary: rgba(90, 205, 190, 0.9);
            --color-secondary-dark: rgba(36, 169, 150, 0.95);
            --color-secondary-light: rgba(90, 205, 190, 0.16);

            --color-accent: rgba(188, 169, 255, 0.85);
            --color-accent-light: rgba(188, 169, 255, 0.22);

            --color-text-primary: rgba(20, 28, 38, 0.95);
            --color-text-secondary: rgba(62, 78, 96, 0.85);
            --color-text-body: rgba(62, 78, 96, 0.85);
            --color-text-headings: rgba(20, 28, 38, 0.95);
            --color-text-muted: rgba(110, 128, 145, 0.75);
            --color-text-inverse: rgba(255, 255, 255, 0.98);
            --color-text-success: rgba(27, 94, 32, 0.92);

            --color-zone-active: rgba(56, 189, 149, 0.95);
            --color-zone-inactive: rgba(110, 128, 145, 0.55);
            --color-zone-manual: rgba(88, 164, 255, 0.95);
            --color-zone-error: rgba(236, 98, 98, 0.95);

            --color-surface: linear-gradient(135deg, rgba(255, 255, 255, 0.24) 0%, rgba(245, 250, 255, 0.18) 100%);
            --color-surface-light: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(240, 248, 255, 0.24) 100%);
            --color-surface-elevated: linear-gradient(135deg, rgba(255, 255, 255, 0.34) 0%, rgba(236, 244, 255, 0.28) 100%);
            --color-surface-overlay: linear-gradient(145deg, rgba(255, 255, 255, 0.38) 0%, rgba(245, 248, 255, 0.3) 100%);
            --color-surface-muted: rgba(255, 255, 255, 0.18);
            --color-surface-dark: rgba(210, 220, 235, 0.18);

            --color-border-light: rgba(255, 255, 255, 0.35);
            --color-border-medium: rgba(147, 167, 188, 0.25);
            --color-border-strong: rgba(110, 128, 145, 0.32);
            --color-border: rgba(210, 220, 235, 0.45);

            --glass-blur: 20px;
            --glass-blur-sm: 12px;
            --glass-blur-medium: 18px;
            --glass-blur-strong: 26px;
            --glass-blur-heavy: 32px;

            --glass-border: 1px solid rgba(255, 255, 255, 0.32);
            --glass-border-accent: 1px solid rgba(88, 164, 255, 0.45);

            --shadow-sm: 0 4px 12px rgba(32, 55, 87, 0.12);
            --shadow-md: 0 10px 24px rgba(32, 55, 87, 0.16);
            --shadow-glass-sm: 0 8px 20px rgba(40, 65, 97, 0.12);
            --shadow-glass-md: 0 16px 36px rgba(32, 55, 87, 0.18);
            --shadow-glass-lg: 0 24px 60px rgba(22, 40, 72, 0.24);
            --shadow-zone-active: 0 18px 46px rgba(56, 189, 149, 0.28);

            --radius-xs: 8px;
            --radius-sm: 12px;
            --radius-base: 16px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --radius-full: 999px;

            --spacing-xs: 6px;
            --spacing-sm: 12px;
            --spacing-md: 20px;
            --spacing-lg: 28px;
            --spacing-xl: 42px;

            --transition-duration-fast: 150ms;
            --transition-duration-base: 250ms;
            --transition-easing: cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: 0.18s ease;
            --transition-base: 0.28s cubic-bezier(0.4, 0, 0.2, 1);

            --header-height: 70px;
            --bottom-nav-height: 68px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-family-main);
            color: var(--color-text-primary);
            background: radial-gradient(120% 120% at 10% 10%, rgba(188, 169, 255, 0.18) 0%, transparent 60%),
                        radial-gradient(120% 120% at 90% 20%, rgba(90, 205, 190, 0.18) 0%, transparent 65%),
                        linear-gradient(135deg, rgba(244, 248, 255, 0.88) 0%, rgba(236, 246, 255, 0.92) 100%);
            padding: calc(var(--header-height) + var(--spacing-lg)) var(--spacing-lg)
                     calc(var(--bottom-nav-height) + var(--spacing-xl));
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            backdrop-filter: blur(var(--glass-blur-heavy)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--glass-blur-heavy)) saturate(160%);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.36) 0%, rgba(245, 250, 255, 0.26) 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(60% 80% at 0% 100%, rgba(88, 164, 255, 0.16), transparent 70%),
                radial-gradient(70% 70% at 100% 0%, rgba(90, 205, 190, 0.16), transparent 70%),
                radial-gradient(40% 50% at 50% 20%, rgba(188, 169, 255, 0.12), transparent 70%);
            mix-blend-mode: screen;
            z-index: -1;
        }

        .page-content-wrapper {
            width: min(1180px, 100%);
            margin: 0 auto;
            display: flex;
            justify-content: center;
            padding: 0;
        }

        .manual-page-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .manual-header {
            padding: var(--spacing-lg);
            border-radius: var(--radius-xl);
            background: var(--color-surface-elevated);
            border: 1px solid var(--color-border-light);
            box-shadow: var(--shadow-glass-md);
            backdrop-filter: blur(var(--glass-blur-medium));
            -webkit-backdrop-filter: blur(var(--glass-blur-medium));
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .manual-header h1 {
            margin: 0;
            font-size: clamp(26px, 3vw, 34px);
            font-weight: 700;
            color: var(--color-text-primary);
        }

        .manual-header p {
            margin: 0;
            font-size: 16px;
            color: var(--color-text-secondary);
            opacity: 0.85;
        }

        .zone-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing-lg);
        }

        .zone-card {
            background: var(--color-surface);
            border: var(--glass-border);
            backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-glass-md);
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all var(--transition-duration-base) var(--transition-easing);
            min-height: 320px;
            display: flex;
            flex-direction: column;
        }

        .zone-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--color-accent);
            transform: translateX(-100%);
            transition: transform 0.4s ease;
        }

        .zone-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-glass-lg);
            background: var(--color-surface-light);
        }

        .zone-card:hover::before {
            transform: translateX(0);
        }

        .zone-card.active {
            background: var(--color-surface-light);
            border-color: var(--color-accent);
            box-shadow: var(--shadow-glass-lg);
        }

        .zone-card.disabled-mode {
            opacity: 0.6;
            pointer-events: none;
            filter: grayscale(70%);
        }

        .zone-card.loading-indicator {
            position: relative;
        }

        .zone-card.loading-indicator::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--color-surface-light);
            backdrop-filter: blur(var(--glass-blur-sm));
            z-index: 5;
            border-radius: var(--radius-xl);
        }

        .zone-card.loading-indicator::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin: -20px 0 0 -20px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid var(--color-accent);
            animation: spin 1s linear infinite;
            z-index: 10;
        }

        .loading-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            text-align: center;
            padding: var(--spacing-md);
            font-size: 14px;
            color: var(--color-text-muted);
            grid-column: 1 / -1;
        }

        .loading-indicator::before {
            content: '';
            width: 32px;
            height: 32px;
            margin: 0 auto var(--spacing-sm);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-left-color: var(--color-accent);
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .zone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }

        .zone-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--color-text-headings);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .zone-id {
            font-size: 12px;
            color: var(--color-text-muted);
            font-weight: 600;
            background: var(--color-surface);
            border: var(--glass-border);
            backdrop-filter: blur(var(--glass-blur-sm));
            padding: 6px 12px;
            border-radius: var(--radius-full);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .duration-control {
            background: var(--color-surface);
            border: var(--glass-border);
            backdrop-filter: blur(var(--glass-blur-sm));
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: var(--spacing-md);
            box-shadow: var(--shadow-glass-sm);
        }

        .duration-label {
            font-size: 11px;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            display: block;
            text-align: center;
        }

        .duration-input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .duration-stepper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stepper-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--color-border);
            background: #ffffff;
            color: var(--color-primary);
            font-size: 20px;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .stepper-btn:hover:not(:disabled) {
            background: var(--color-primary);
            color: var(--color-text-inverse);
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
            border-color: transparent;
        }

        .stepper-btn:active {
            transform: scale(0.95);
        }

        .stepper-btn:disabled {
            color: var(--color-text-muted);
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--color-surface-dark);
        }

        .duration-input {
            width: 80px;
            height: 48px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: var(--color-text-headings);
            background: var(--color-surface);
            border: var(--glass-border);
            backdrop-filter: blur(var(--glass-blur-sm));
            border-radius: var(--radius-base);
            padding: 8px 12px;
            transition: all var(--transition-duration-fast) ease;
        }

        .duration-input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: var(--shadow-glass-md);
            background: var(--color-surface-light);
        }

        .duration-input::-webkit-inner-spin-button,
        .duration-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .duration-input[type=number] {
            -moz-appearance: textfield;
        }

        .duration-unit {
            font-size: 14px;
            color: var(--color-text-muted);
            font-weight: 500;
            margin-left: -8px;
        }

        .progress-container {
            position: relative;
            margin-bottom: var(--spacing-md);
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .progress-ring svg {
            width: 180px;
            height: 180px;
            transform: rotate(-90deg);
        }

        .progress-background {
            stroke: rgba(255, 255, 255, 0.35);
            stroke-width: 10;
        }

        .progress-value {
            stroke: var(--color-accent);
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s ease;
        }

        .progress-inner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--color-text-headings);
        }

        .progress-time {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--color-text-headings);
            margin: 0;
        }

        .progress-label {
            font-size: 12px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--color-text-muted);
            margin-top: 8px;
        }

        .zone-controls {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .zone-controls .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: var(--radius-lg);
            border: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform var(--transition-duration-fast) ease, box-shadow var(--transition-duration-fast) ease;
            box-shadow: var(--shadow-glass-sm);
        }

        .zone-controls .button.primary {
            background: var(--color-primary-gradient);
            color: var(--color-text-inverse);
            box-shadow: var(--shadow-glass-md);
        }

        .zone-controls .button.secondary {
            background: var(--color-surface);
            color: var(--color-text-headings);
            border: var(--glass-border);
        }

        .zone-controls .button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glass-lg);
        }

        .zone-controls .button:active {
            transform: translateY(0);
        }

        .zone-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            background: rgba(88, 164, 255, 0.12);
            border: 1px solid rgba(88, 164, 255, 0.3);
            color: var(--color-primary-dark);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }

        .zone-status-icon {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(88, 164, 255, 0.15);
        }

        .zone-status.running {
            background: rgba(56, 189, 149, 0.12);
            border-color: rgba(56, 189, 149, 0.3);
            color: var(--color-zone-active);
            box-shadow: var(--shadow-zone-active);
        }

        .zone-status.error {
            background: rgba(236, 98, 98, 0.12);
            border-color: rgba(236, 98, 98, 0.3);
            color: var(--color-zone-error);
        }

        .manual-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 28, 38, 0.35);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            z-index: 1000;
            padding: var(--spacing-lg);
        }

        .manual-overlay .overlay-content {
            background: var(--color-surface-elevated);
            border-radius: var(--radius-xl);
            border: var(--glass-border);
            padding: var(--spacing-xl);
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-glass-lg);
        }

        .manual-overlay h2 {
            margin: 0 0 var(--spacing-sm);
            color: var(--color-text-headings);
        }

        .manual-overlay p {
            margin: 0 0 var(--spacing-md);
            color: var(--color-text-body);
            line-height: 1.6;
        }

        .manual-overlay .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: var(--radius-lg);
            border: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform var(--transition-duration-fast) ease, box-shadow var(--transition-duration-fast) ease;
            box-shadow: var(--shadow-glass-sm);
        }

        .manual-overlay .button.primary {
            background: var(--color-primary-gradient);
            color: var(--color-text-inverse);
            box-shadow: var(--shadow-glass-md);
        }

        .manual-overlay .button.secondary {
            background: transparent;
            border: var(--glass-border);
            color: var(--color-text-headings);
        }

        .manual-overlay .button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glass-lg);
        }

        .manual-overlay .button:active {
            transform: translateY(0);
        }

        .no-zones-card {
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            border: var(--glass-border);
            padding: var(--spacing-xl);
            text-align: center;
            box-shadow: var(--shadow-glass-md);
        }

        .no-zones-card h3 {
            margin: 0 0 var(--spacing-sm);
            color: var(--color-text-headings);
        }

        .no-zones-card p {
            margin: 0 0 var(--spacing-md);
            color: var(--color-text-body);
            line-height: 1.6;
        }

        .no-zones-actions {
            display: flex;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .no-zones-actions .button {
            padding: 12px 24px;
            border-radius: var(--radius-lg);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border: none;
            cursor: pointer;
            transition: transform var(--transition-duration-fast) ease, box-shadow var(--transition-duration-fast) ease;
        }

        .no-zones-actions .button.primary {
            background: var(--color-primary-gradient);
            color: var(--color-text-inverse);
            box-shadow: var(--shadow-glass-md);
        }

        .no-zones-actions .button.secondary {
            background: transparent;
            border: var(--glass-border);
            color: var(--color-text-headings);
        }

        .no-zones-actions .button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glass-lg);
        }

        .no-zones-actions .button:active {
            transform: translateY(0);
        }

        @media (max-width: 1024px) {
            body {
                padding: calc(var(--header-height) + var(--spacing-md)) var(--spacing-md)
                         calc(var(--bottom-nav-height) + var(--spacing-lg));
            }

            .zone-grid-container {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        @media (max-width: 768px) {
            body {
                padding: calc(var(--header-height) + var(--spacing-sm)) var(--spacing-sm)
                         calc(var(--bottom-nav-height) + var(--spacing-md));
            }

            .manual-header {
                padding: var(--spacing-md);
            }

            .zone-grid-container {
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                gap: var(--spacing-md);
            }

            .zone-controls {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 520px) {
            .zone-grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page-content-wrapper">
        <div class="manual-page-container">
            <header class="manual-header">
                <h1 data-i18n="manual.pageTitle">Controllo Manuale</h1>
                <p data-i18n="manual.pageSubtitle">Gestisci in tempo reale le zone e monitora lo stato del sistema</p>
            </header>

            <div class="zone-grid-container" id="zone-container">
                <div class="loading-indicator" data-i18n="general.loading">Caricamento...</div>
            </div>
        </div>
    </div>
    
    <script>
        // Namespace per stato locale
        window.ManualPage = window.ManualPage || {
            zoneStates: new Map() 
        };
    </script>
</body>
</html>
