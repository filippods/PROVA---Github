<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="programs.pageTitle">Gestione Programmi Irrigazione</title>
    <link rel="icon" href="favicon.webp" type="image/webp">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --font-family-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

            --color-primary: rgba(88, 164, 255, 0.92);
            --color-primary-dark: rgba(42, 123, 222, 0.95);
            --color-primary-light: rgba(88, 164, 255, 0.18);
            --color-primary-gradient: linear-gradient(135deg, rgba(88, 164, 255, 0.9) 0%, rgba(42, 123, 222, 0.85) 100%);
            --color-primary-rgb: 88, 164, 255;

            --color-secondary: rgba(90, 205, 190, 0.9);
            --color-secondary-dark: rgba(36, 169, 150, 0.95);
            --color-secondary-light: rgba(90, 205, 190, 0.16);

            --color-accent: rgba(188, 169, 255, 0.85);
            --color-accent-light: rgba(188, 169, 255, 0.22);

            --color-text-primary: rgba(20, 28, 38, 0.95);
            --color-text-secondary: rgba(62, 78, 96, 0.85);
            --color-text-muted: rgba(110, 128, 145, 0.75);
            --color-text-inverse: rgba(255, 255, 255, 0.98);
            --color-text-light: rgba(255, 255, 255, 0.85);

            --color-success: rgba(56, 189, 149, 0.95);
            --color-warning: rgba(255, 196, 105, 0.95);
            --color-danger: rgba(236, 98, 98, 0.95);

            --color-border-light: rgba(255, 255, 255, 0.35);
            --color-border-medium: rgba(147, 167, 188, 0.25);
            --color-border-strong: rgba(110, 128, 145, 0.32);
            --color-border-accent: rgba(88, 164, 255, 0.4);

            --color-surface: linear-gradient(135deg, rgba(255, 255, 255, 0.24) 0%, rgba(245, 250, 255, 0.18) 100%);
            --color-surface-elevated: linear-gradient(135deg, rgba(255, 255, 255, 0.32) 0%, rgba(240, 248, 255, 0.26) 100%);
            --color-surface-overlay: linear-gradient(145deg, rgba(255, 255, 255, 0.38) 0%, rgba(245, 248, 255, 0.3) 100%);
            --color-surface-muted: rgba(255, 255, 255, 0.16);

            --glass-blur-light: 12px;
            --glass-blur-medium: 18px;
            --glass-blur-strong: 26px;

            --shadow-soft: 0 8px 28px rgba(40, 65, 97, 0.14);
            --shadow-medium: 0 16px 42px rgba(32, 55, 87, 0.2);
            --shadow-intense: 0 26px 78px rgba(22, 40, 72, 0.26);

            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 28px;
            --radius-pill: 999px;

            --spacing-xs: 6px;
            --spacing-sm: 12px;
            --spacing-md: 20px;
            --spacing-lg: 28px;
            --spacing-xl: 42px;

            --transition-fast: 0.18s ease;
            --transition-base: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.45s cubic-bezier(0.22, 1, 0.36, 1);

            --header-height: 70px;
            --bottom-nav-height: 68px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-family-main);
            color: var(--color-text-primary);
            background: radial-gradient(120% 120% at 10% 10%, rgba(188, 169, 255, 0.18) 0%, transparent 60%),
                        radial-gradient(120% 120% at 90% 20%, rgba(90, 205, 190, 0.18) 0%, transparent 65%),
                        linear-gradient(135deg, rgba(244, 248, 255, 0.88) 0%, rgba(236, 246, 255, 0.92) 100%);
            padding: calc(var(--header-height) + var(--spacing-lg)) var(--spacing-lg)
                     calc(var(--bottom-nav-height) + var(--spacing-xl));
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            backdrop-filter: blur(var(--glass-blur-strong)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--glass-blur-strong)) saturate(160%);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.36) 0%, rgba(245, 250, 255, 0.26) 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(60% 80% at 0% 100%, rgba(88, 164, 255, 0.16), transparent 70%),
                radial-gradient(70% 70% at 100% 0%, rgba(90, 205, 190, 0.16), transparent 70%),
                radial-gradient(40% 50% at 50% 20%, rgba(188, 169, 255, 0.12), transparent 70%);
            mix-blend-mode: screen;
            z-index: -1;
        }

        .page-content-wrapper {
            width: min(1180px, 100%);
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }

        .view-programs-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .page-header {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            padding: var(--spacing-lg);
            background: var(--color-surface-elevated);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border-light);
            box-shadow: var(--shadow-soft);
            backdrop-filter: blur(var(--glass-blur-medium));
            -webkit-backdrop-filter: blur(var(--glass-blur-medium));
        }

        .page-header h1 {
            font-size: clamp(26px, 3vw, 34px);
            font-weight: 700;
            margin: 0;
            color: var(--color-text-primary);
        }

        .page-header p {
            margin: 0;
            font-size: 16px;
            color: var(--color-text-secondary);
            opacity: 0.85;
        }

        .page-header .header-actions {
            margin-top: var(--spacing-sm);
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }

        .programs-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: var(--spacing-lg);
            width: 100%;
        }

        .loading-indicator,
        .loading {
            width: 100%;
            padding: var(--spacing-xl) var(--spacing-lg);
            text-align: center;
            font-weight: 600;
            color: var(--color-text-secondary);
            background: rgba(255, 255, 255, 0.58);
            border-radius: var(--radius-lg);
            border: 1px dashed rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(var(--glass-blur-light));
        }

        .loading-indicator::before,
        .loading::before {
            content: '';
            width: 42px;
            height: 42px;
            margin: 0 auto var(--spacing-sm);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-top-color: rgba(var(--color-primary-rgb), 0.75);
            display: block;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .program-card,
        .add-program-card {
            position: relative;
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.58);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            transition: transform var(--transition-base), box-shadow var(--transition-base), border-color var(--transition-base);
            backdrop-filter: blur(var(--glass-blur-medium));
            -webkit-backdrop-filter: blur(var(--glass-blur-medium));
            min-height: 340px;
        }

        .program-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(88, 164, 255, 0.08));
            opacity: 0;
            transition: opacity var(--transition-base);
            pointer-events: none;
        }

        .program-card:hover,
        .add-program-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-medium);
            border-color: rgba(var(--color-primary-rgb), 0.4);
        }

        .program-card:hover::after {
            opacity: 1;
        }

        .program-card.active-program {
            border-color: rgba(var(--color-primary-rgb), 0.65);
            box-shadow: 0 24px 46px rgba(var(--color-primary-rgb), 0.26);
            background: linear-gradient(135deg, rgba(88, 164, 255, 0.3) 0%, rgba(90, 205, 190, 0.22) 100%);
        }

        .program-card-header {
            display: flex;
            flex-direction: column;
        }

        .program-title-section {
            padding: var(--spacing-lg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.6);
        }

        .program-title-section h3 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--color-text-primary);
        }

        .active-indicator {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            background: rgba(var(--color-primary-rgb), 0.95);
            color: var(--color-text-inverse);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 12px 26px rgba(var(--color-primary-rgb), 0.35);
        }

        .program-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            padding: var(--spacing-lg);
            color: var(--color-text-secondary);
        }

        .info-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: var(--spacing-xs) var(--spacing-md);
            align-items: center;
        }

        .info-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--color-text-muted);
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .months-grid,
        .zones-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .month-tag,
        .zone-tag {
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 12px;
            font-weight: 600;
            color: var(--color-text-secondary);
            letter-spacing: 0.4px;
        }

        .tags-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .program-actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-sm);
            padding-top: var(--spacing-sm);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast), border-color var(--transition-fast);
        }

        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(var(--color-primary-rgb), 0.3);
        }

        .btn.primary,
        .btn-start {
            background: var(--color-primary-gradient);
            color: var(--color-text-inverse);
            border-color: rgba(var(--color-primary-rgb), 0.45);
            box-shadow: 0 10px 24px rgba(var(--color-primary-rgb), 0.24);
        }

        .btn.primary:hover,
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(var(--color-primary-rgb), 0.32);
        }

        .btn-edit,
        .btn-outline {
            background: rgba(255, 255, 255, 0.65);
            color: var(--color-text-primary);
            border-color: rgba(255, 255, 255, 0.7);
        }

        .btn-edit:hover,
        .btn-outline:hover {
            transform: translateY(-2px);
            border-color: rgba(var(--color-primary-rgb), 0.35);
            box-shadow: var(--shadow-soft);
        }

        .btn-delete {
            background: rgba(236, 98, 98, 0.12);
            color: rgba(176, 44, 44, 0.95);
            border-color: rgba(236, 98, 98, 0.3);
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(236, 98, 98, 0.25);
            border-color: rgba(236, 98, 98, 0.45);
        }

        .program-footer {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.55);
            overflow: hidden;
        }

        .zone-progress-bar,
        .progress-bar {
            height: 100%;
            width: 0;
            background: var(--color-primary-gradient);
            transition: width 0.3s ease;
        }

        .program-timer {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-secondary);
        }

        .auto-program-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.45);
        }

        .auto-status-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-text-secondary);
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: rgba(255, 255, 255, 0.65);
            border-radius: var(--radius-pill);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: background var(--transition-base), border-color var(--transition-base);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--color-text-inverse);
            box-shadow: 0 4px 12px rgba(20, 28, 38, 0.2);
            transition: transform var(--transition-base);
        }

        .toggle-switch.active {
            background: rgba(var(--color-primary-rgb), 0.9);
            border-color: rgba(var(--color-primary-rgb), 0.6);
        }

        .toggle-switch.active::after {
            transform: translateX(20px);
        }

        .global-stop-container {
            display: flex;
            justify-content: center;
        }

        .global-stop-btn,
        .banner-stop-btn,
        .stop-program-button {
            padding: 16px 32px;
            border-radius: var(--radius-pill);
            background: linear-gradient(135deg, rgba(236, 98, 98, 0.92) 0%, rgba(214, 68, 68, 0.9) 100%);
            color: var(--color-text-inverse);
            font-size: 16px;
            font-weight: 700;
            border: none;
            box-shadow: 0 20px 40px rgba(236, 98, 98, 0.32);
            cursor: pointer;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
        }

        .global-stop-btn:hover,
        .banner-stop-btn:hover,
        .stop-program-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 26px 52px rgba(236, 98, 98, 0.4);
        }

        .add-program-card {
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--color-text-secondary);
            border-style: dashed;
            border-color: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            gap: 12px;
        }

        .add-program-card svg {
            width: 56px;
            height: 56px;
            fill: currentColor;
        }

        .add-program-card span {
            font-size: 18px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: var(--shadow-soft);
        }

        .empty-state h3 {
            margin-bottom: var(--spacing-sm);
            font-size: 20px;
            color: var(--color-text-primary);
        }

        .empty-state p {
            margin-bottom: var(--spacing-md);
            color: var(--color-text-secondary);
        }

        @media (max-width: 1024px) {
            body {
                padding: calc(var(--header-height) + var(--spacing-md)) var(--spacing-md)
                         calc(var(--bottom-nav-height) + var(--spacing-lg));
            }
        }

        @media (max-width: 768px) {
            body {
                padding: calc(var(--header-height) + var(--spacing-sm)) var(--spacing-sm)
                         calc(var(--bottom-nav-height) + var(--spacing-md));
            }

            .page-header {
                padding: var(--spacing-md);
            }

            .page-header .header-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="page-content-wrapper">
        <div class="view-programs-container">
            <header class="page-header">
                <h1 data-i18n="programs.pageTitle">Programmi di Irrigazione</h1>
                <p data-i18n="programs.pageSubtitle">Monitora, avvia e modifica i programmi della tua rete IrrigaSmart</p>
                <div class="header-actions">
                    <button class="btn primary" onclick="IrrigationRouter?.loadPage('create_program.html') ?? window.loadPage?.('create_program.html')">
                        <span data-i18n="programs.newProgram">Nuovo Programma</span>
                    </button>
                    <button class="btn btn-outline" onclick="initializeViewProgramsPage?.()">
                        <span data-i18n="general.refresh">Aggiorna</span>
                    </button>
                </div>
            </header>

            <div class="programs-container" id="programs-container">
                <div class="loading-indicator" data-i18n="general.loading">Caricamento...</div>
            </div>

            <div id="global-stop-button" class="global-stop-container" style="display:none;"></div>
        </div>
    </div>

    <script>
        // Mantiene la compatibilità con gli script legacy che si aspettano questo namespace
        window.ViewProgramsPageState = window.ViewProgramsPageState || {
            programStates: new Map()
        };
    </script>
</body>
</html>
