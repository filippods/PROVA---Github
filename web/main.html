<!DOCTYPE html>
<html lang="it"> <!-- lang will be updated by JS -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="appName">Irrigazione Smart Home</title>
    <link rel="icon" href="favicon.webp" type="image/webp">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --font-family-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

            --color-primary: rgba(88, 164, 255, 0.92);
            --color-primary-dark: rgba(42, 123, 222, 0.95);
            --color-primary-light: rgba(88, 164, 255, 0.18);
            --color-primary-gradient: linear-gradient(135deg, rgba(88, 164, 255, 0.9) 0%, rgba(42, 123, 222, 0.85) 100%);
            --color-primary-rgb: 88, 164, 255;

            --color-secondary: rgba(90, 205, 190, 0.9);
            --color-secondary-dark: rgba(36, 169, 150, 0.95);
            --color-secondary-light: rgba(90, 205, 190, 0.16);

            --color-accent: rgba(188, 169, 255, 0.85);
            --color-accent-light: rgba(188, 169, 255, 0.2);

            --color-text-primary: rgba(20, 28, 38, 0.95);
            --color-text-secondary: rgba(62, 78, 96, 0.85);
            --color-text-muted: rgba(110, 128, 145, 0.75);
            --color-text-inverse: rgba(255, 255, 255, 0.98);
            --color-text-light: rgba(255, 255, 255, 0.85);

            --color-success: rgba(56, 189, 149, 0.95);
            --color-success-rgb: 56, 189, 149;
            --color-info: rgba(88, 164, 255, 0.95);
            --color-warning: rgba(255, 196, 105, 0.95);
            --color-warning-rgb: 255, 196, 105;
            --color-danger: rgba(236, 98, 98, 0.95);
            --color-danger-dark: rgba(214, 68, 68, 0.95);
            --color-danger-rgb: 236, 98, 98;

            --color-border-light: rgba(255, 255, 255, 0.35);
            --color-border-medium: rgba(147, 167, 188, 0.25);
            --color-border-strong: rgba(110, 128, 145, 0.35);
            --color-border-accent: rgba(88, 164, 255, 0.4);

            --color-surface: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(245, 250, 255, 0.18) 100%);
            --color-surface-elevated: linear-gradient(135deg, rgba(255, 255, 255, 0.32) 0%, rgba(240, 248, 255, 0.26) 100%);
            --color-surface-overlay: linear-gradient(145deg, rgba(255, 255, 255, 0.35) 0%, rgba(245, 248, 255, 0.28) 100%);
            --color-surface-muted: rgba(255, 255, 255, 0.16);

            --glass-blur-light: 12px;
            --glass-blur-medium: 18px;
            --glass-blur-strong: 28px;

            --shadow-soft: 0 8px 28px rgba(40, 65, 97, 0.15);
            --shadow-medium: 0 14px 40px rgba(32, 55, 87, 0.22);
            --shadow-intense: 0 25px 70px rgba(22, 40, 72, 0.28);

            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-pill: 999px;

            --spacing-xs: 6px;
            --spacing-sm: 12px;
            --spacing-md: 18px;
            --spacing-lg: 28px;
            --spacing-xl: 42px;

            --transition-fast: 0.18s ease;
            --transition-base: 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.45s cubic-bezier(0.22, 1, 0.36, 1);

            --header-height: 70px;
            --bottom-nav-height: 68px;
            --banner-height: 0px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: var(--font-family-main);
            color: var(--color-text-primary);
            background: radial-gradient(120% 120% at 10% 10%, rgba(188, 169, 255, 0.18) 0%, transparent 60%),
                        radial-gradient(120% 120% at 90% 20%, rgba(90, 205, 190, 0.18) 0%, transparent 65%),
                        linear-gradient(135deg, rgba(244, 248, 255, 0.8) 0%, rgba(236, 246, 255, 0.9) 100%);
            padding: var(--header-height) var(--spacing-md) calc(var(--bottom-nav-height) + var(--spacing-md));
            transition: padding var(--transition-base);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            backdrop-filter: blur(var(--glass-blur-strong)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--glass-blur-strong)) saturate(160%);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, rgba(245, 250, 255, 0.25) 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(60% 80% at 0% 100%, rgba(88, 164, 255, 0.16), transparent 70%),
                radial-gradient(70% 70% at 100% 0%, rgba(90, 205, 190, 0.16), transparent 70%),
                radial-gradient(40% 50% at 50% 20%, rgba(188, 169, 255, 0.12), transparent 70%);
            mix-blend-mode: screen;
            z-index: -1;
        }

        body.has-banner {
            padding-top: calc(var(--header-height) + var(--banner-height));
        }

        body.program-running {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--spacing-lg);
            backdrop-filter: blur(var(--glass-blur-medium)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--glass-blur-medium)) saturate(160%);
            background: var(--color-surface-elevated);
            border-bottom: 1px solid var(--color-border-light);
            box-shadow: var(--shadow-soft);
            z-index: 1000;
        }

        .datetime {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 12px;
            letter-spacing: 0.4px;
            color: var(--color-text-muted);
        }

        #time {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .logo {
            flex: 1;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            color: var(--color-primary-dark);
            letter-spacing: -0.2px;
            text-shadow: 0 8px 20px rgba(var(--color-primary-rgb), 0.15);
        }

        .header-action-icon {
            width: 46px;
            height: 46px;
            border-radius: var(--radius-pill);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(var(--glass-blur-light)) saturate(150%);
            -webkit-backdrop-filter: blur(var(--glass-blur-light)) saturate(150%);
            color: var(--color-text-secondary);
            transition: all var(--transition-base);
            box-shadow: 0 10px 30px rgba(20, 40, 80, 0.18);
            cursor: pointer;
        }

        .header-action-icon svg {
            width: 22px;
            height: 22px;
        }

        .header-action-icon:hover,
        .header-action-icon:focus-visible {
            border-color: var(--color-border-accent);
            color: var(--color-primary);
            transform: translateY(-2px) scale(1.03);
            box-shadow: var(--shadow-medium);
            outline: none;
        }

        .header-action-icon:active {
            transform: translateY(0) scale(0.97);
        }

        .header-action-icon.stop-all-icon {
            color: var(--color-danger);
            border-color: rgba(var(--color-danger-rgb), 0.4);
            background: rgba(var(--color-danger-rgb), 0.12);
            box-shadow: 0 12px 32px rgba(var(--color-danger-rgb), 0.2);
        }

        .header-action-icon.stop-all-icon:hover,
        .header-action-icon.stop-all-icon:focus-visible {
            color: var(--color-text-inverse);
            background: linear-gradient(135deg, var(--color-danger), var(--color-danger-dark));
            box-shadow: 0 18px 40px rgba(var(--color-danger-rgb), 0.35);
        }

        .program-status-banner {
            display: none;
            position: fixed;
            top: var(--header-height);
            left: 50%;
            transform: translate(-50%, -16px);
            width: min(940px, calc(100% - 2 * var(--spacing-md)));
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.58), rgba(245, 252, 255, 0.36));
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-medium);
            overflow: hidden;
            opacity: 0;
            transition: opacity var(--transition-base), transform var(--transition-base);
            backdrop-filter: blur(var(--glass-blur-medium)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--glass-blur-medium)) saturate(180%);
            z-index: 950;
        }

        .program-status-banner.visible {
            display: block;
            opacity: 1;
            transform: translate(-50%, 12px);
        }

        .banner-content {
            position: relative;
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
            padding: var(--spacing-md) var(--spacing-lg);
        }

        .program-status-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.3), transparent 60%);
            opacity: 0.8;
        }

        .program-status-banner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 120% at 0% 0%, rgba(88, 164, 255, 0.18), transparent 60%),
                        radial-gradient(100% 120% at 100% 0%, rgba(90, 205, 190, 0.18), transparent 65%);
            mix-blend-mode: color-dodge;
            opacity: 0.6;
        }

        .banner-left {
            position: relative;
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            flex: 1;
            z-index: 1;
        }

        .banner-icon {
            width: 56px;
            height: 56px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(88, 164, 255, 0.28), rgba(188, 169, 255, 0.25));
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 16px 30px rgba(52, 110, 199, 0.24);
        }

        .banner-icon svg {
            width: 28px;
            height: 28px;
            fill: var(--color-text-inverse);
            filter: drop-shadow(0 8px 14px rgba(42, 95, 180, 0.3));
        }

        .banner-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: var(--color-text-secondary);
        }

        #banner-program-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        #banner-active-zone {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--color-primary);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            background: rgba(var(--color-primary-rgb), 0.12);
        }

        .banner-stop-btn {
            position: relative;
            z-index: 1;
            border: none;
            border-radius: var(--radius-pill);
            padding: 14px 28px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: var(--color-text-inverse);
            background: linear-gradient(130deg, var(--color-danger), var(--color-danger-dark));
            box-shadow: 0 18px 40px rgba(var(--color-danger-rgb), 0.3);
            cursor: pointer;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
        }

        .banner-stop-btn:hover,
        .banner-stop-btn:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 20px 46px rgba(var(--color-danger-rgb), 0.38);
            outline: none;
        }

        .banner-progress {
            position: relative;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.35);
            overflow: hidden;
        }

        .banner-progress-bar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.4));
            transition: width 0.35s ease;
        }

        #content {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-content-wrapper {
            min-height: calc(100vh - var(--header-height) - var(--bottom-nav-height) - var(--spacing-xl));
            padding: var(--spacing-lg) 0;
        }

        .loading-indicator {
            display: grid;
            place-items: center;
            padding: var(--spacing-xl);
            color: var(--color-text-muted);
            gap: var(--spacing-sm);
        }

        .loading-indicator::after {
            content: '';
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 3px solid rgba(var(--color-primary-rgb), 0.18);
            border-top-color: rgba(var(--color-primary-rgb), 0.7);
            animation: spin 0.9s linear infinite;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--bottom-nav-height);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--spacing-sm);
            padding: 0 var(--spacing-md) var(--spacing-sm);
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(var(--glass-blur-medium)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--glass-blur-medium)) saturate(180%);
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 -8px 30px rgba(23, 40, 72, 0.18);
            z-index: 1000;
        }

        .bottom-nav-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: var(--radius-pill);
            padding: var(--spacing-xs) var(--spacing-md);
            color: var(--color-text-secondary);
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid transparent;
            transition: all var(--transition-base);
            cursor: pointer;
        }

        .bottom-nav-item svg {
            width: 24px;
            height: 24px;
            transition: transform var(--transition-fast);
        }

        .bottom-nav-item:hover,
        .bottom-nav-item:focus-visible {
            color: var(--color-primary);
            border-color: rgba(var(--color-primary-rgb), 0.35);
            box-shadow: 0 14px 30px rgba(var(--color-primary-rgb), 0.25);
            transform: translateY(-3px);
            outline: none;
        }

        .bottom-nav-item.active {
            color: var(--color-text-inverse);
            background: var(--color-primary-gradient);
            border-color: transparent;
            box-shadow: 0 18px 38px rgba(var(--color-primary-rgb), 0.35);
        }

        .bottom-nav-item.active svg {
            transform: scale(1.08);
            fill: currentColor;
        }

        .toast-container {
            position: fixed;
            top: calc(var(--header-height) + var(--spacing-md));
            right: var(--spacing-md);
            width: min(340px, calc(100% - 2 * var(--spacing-md)));
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            z-index: 1100;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            backdrop-filter: blur(var(--glass-blur-light)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--glass-blur-light)) saturate(160%);
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: var(--shadow-soft);
            color: var(--color-text-primary);
            opacity: 0;
            transform: translateX(20px);
            transition: opacity var(--transition-base), transform var(--transition-base);
            cursor: pointer;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast.success { border-left: 4px solid rgba(var(--color-success-rgb), 0.9); }
        .toast.error { border-left: 4px solid rgba(var(--color-danger-rgb), 0.9); }
        .toast.info { border-left: 4px solid rgba(var(--color-primary-rgb), 0.9); }
        .toast.warning { border-left: 4px solid rgba(var(--color-warning-rgb), 0.9); }

        .toast-icon svg {
            width: 20px;
            height: 20px;
            display: block;
        }

        .global-program-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            background: rgba(12, 22, 40, 0.55);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-slow), visibility var(--transition-slow);
            z-index: 1200;
        }

        .global-program-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .overlay-content {
            width: min(640px, 100%);
            max-height: 90vh;
            overflow: hidden;
            border-radius: 32px;
            padding: var(--spacing-xl) var(--spacing-lg);
            background: var(--color-surface-overlay);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: var(--shadow-intense);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .overlay-content::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), transparent 60%);
            pointer-events: none;
        }

        .overlay-header {
            position: relative;
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .overlay-icon {
            width: 78px;
            height: 78px;
            border-radius: 26px;
            background: linear-gradient(135deg, rgba(var(--color-success-rgb), 0.25), rgba(var(--color-primary-rgb), 0.25));
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 18px 42px rgba(var(--color-success-rgb), 0.28);
        }

        .overlay-icon svg {
            width: 38px;
            height: 38px;
            fill: var(--color-text-inverse);
        }

        .overlay-title-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .overlay-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--color-text-primary);
        }

        .overlay-program-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-primary);
        }

        .overlay-subtitle {
            font-size: 13px;
            color: var(--color-text-muted);
        }

        .overlay-realtime-info {
            position: relative;
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .program-steps-container {
            max-height: 280px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            padding-right: 6px;
        }

        .program-steps-container::-webkit-scrollbar {
            width: 6px;
        }

        .program-steps-container::-webkit-scrollbar-thumb {
            background: rgba(var(--color-primary-rgb), 0.4);
            border-radius: 999px;
        }

        .program-step {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            transition: transform var(--transition-base), box-shadow var(--transition-base);
        }

        .program-step.active {
            border-color: rgba(var(--color-primary-rgb), 0.4);
            box-shadow: 0 12px 28px rgba(var(--color-primary-rgb), 0.25);
        }

        .program-step.completed {
            opacity: 0.75;
        }

        .program-step.pending {
            opacity: 0.6;
        }

        .program-step .step-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .step-status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(var(--color-primary-rgb), 0.2);
        }

        .program-step.active .step-status-indicator {
            background: rgba(var(--color-primary-rgb), 0.85);
            box-shadow: 0 0 0 6px rgba(var(--color-primary-rgb), 0.18);
        }

        .program-step.completed .step-status-indicator {
            background: rgba(var(--color-success-rgb), 0.85);
        }

        .program-step.pending .step-status-indicator {
            background: rgba(var(--color-text-muted), 0.4);
        }

        .step-zone-name {
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .step-duration {
            font-size: 12px;
            color: var(--color-text-muted);
        }

        .step-progress {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            min-width: 92px;
        }

        .step-timer {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--color-text-secondary);
        }

        .step-timer.active {
            color: var(--color-primary);
        }

        .step-progress-bar {
            width: 80px;
            height: 6px;
            background: rgba(var(--color-primary-rgb), 0.16);
            border-radius: 999px;
            overflow: hidden;
        }

        .step-progress-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, rgba(var(--color-primary-rgb), 0.9), rgba(var(--color-success-rgb), 0.9));
            transition: width 0.6s ease;
        }

        .step-progress-fill.active {
            box-shadow: 0 6px 18px rgba(var(--color-primary-rgb), 0.28);
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--color-text-muted);
        }

        .overall-progress {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--color-text-secondary);
        }

        .progress-bar-overlay {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: rgba(var(--color-primary-rgb), 0.16);
            overflow: hidden;
        }

        .progress-bar-fill-overlay {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, rgba(var(--color-primary-rgb), 0.85), rgba(var(--color-success-rgb), 0.85));
            transition: width 0.6s ease;
        }

        .overlay-stop-button {
            align-self: stretch;
            border: none;
            border-radius: var(--radius-pill);
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--color-text-inverse);
            background: linear-gradient(130deg, var(--color-danger), var(--color-danger-dark));
            box-shadow: 0 20px 46px rgba(var(--color-danger-rgb), 0.35);
            cursor: pointer;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
            position: relative;
            overflow: hidden;
        }

        .overlay-stop-button::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.22), transparent 60%);
            opacity: 0;
            transition: opacity var(--transition-base);
        }

        .overlay-stop-button:hover,
        .overlay-stop-button:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 26px 60px rgba(var(--color-danger-rgb), 0.4);
            outline: none;
        }

        .overlay-stop-button:hover::after,
        .overlay-stop-button:focus-visible::after {
            opacity: 1;
        }

        .overlay-stop-button.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .overlay-stop-button.loading::before {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            left: calc(50% - 11px);
            top: calc(50% - 11px);
            animation: spin 0.75s linear infinite;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(255, 255, 255, 0.45);
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.65);
            color: var(--color-text-primary);
            font-weight: 600;
            transition: all var(--transition-base);
            cursor: pointer;
        }

        .button.primary {
            background: var(--color-primary-gradient);
            color: var(--color-text-inverse);
            border-color: transparent;
            box-shadow: 0 16px 36px rgba(var(--color-primary-rgb), 0.28);
        }

        .button.secondary {
            background: rgba(255, 255, 255, 0.55);
        }

        .button.danger {
            background: linear-gradient(135deg, var(--color-danger), var(--color-danger-dark));
            color: var(--color-text-inverse);
            border-color: transparent;
        }

        .button:disabled,
        .button.disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 900px) {
            body {
                padding-left: var(--spacing-sm);
                padding-right: var(--spacing-sm);
            }

            .status-bar {
                padding: 0 var(--spacing-md);
            }

            .program-status-banner {
                width: calc(100% - 2 * var(--spacing-sm));
            }

            .overlay-content {
                padding: var(--spacing-lg);
                border-radius: 26px;
            }
        }

        @media (max-width: 640px) {
            :root {
                --header-height: 64px;
                --bottom-nav-height: 72px;

            body {

    </style>

<script>
    // Polyfill critico per crypto.randomUUID - deve essere caricato per primo
    (function() {
        if (typeof window.crypto === 'undefined') {
            window.crypto = {};
        }
        
        if (!window.crypto.randomUUID) {
            window.crypto.randomUUID = function() {
                if (typeof crypto.getRandomValues === 'function') {
                    return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, function(c) {
                        return (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16);
                    });
                } else {
                    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                        var r = Math.random() * 16 | 0;
                        var v = c == 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                }
            };
        }
    })();
</script>

    <script>
        // Funzione per fermare il programma dal banner
        function stopProgram() {
            if (window.IrrigationAPI?.stopProgram) {
                window.IrrigationAPI.stopProgram();
            } else if (typeof window.stopProgram === 'function') { 
                window.stopProgram();
            }
        }

        // Funzione per fermare il programma dall'overlay
        function stopProgramFromOverlay() {
            const stopButton = document.getElementById('overlay-stop-button');
            if (stopButton) {
                stopButton.classList.add('loading');
            }
            
            if (window.IrrigationAPI?.stopProgram) {
                window.IrrigationAPI.stopProgram();
            } else if (typeof window.stopProgram === 'function') { 
                window.stopProgram();
            }
        }
        
        // Funzione per arresto totale dall'icona nell'header
        function stopAllPrograms() { 
            console.log("ARRESTO TOTALE richiesto.");
            
            // Chiamata all'endpoint di arresto totale
            fetch('/emergency_stop_all', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({})
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    if (window.IrrigationToast) {
                        window.IrrigationToast.show('Arresto totale completato', 'success');
                    }
                    console.log("ARRESTO TOTALE completato con successo");
                } else {
                    if (window.IrrigationToast) {
                        window.IrrigationToast.show('Errore durante arresto totale: ' + (data.error || 'Errore sconosciuto'), 'error');
                    }
                    console.error("Errore ARRESTO TOTALE:", data.error);
                }
            })
            .catch(error => {
                console.error("Errore chiamata ARRESTO TOTALE:", error);
                if (window.IrrigationToast) {
                    window.IrrigationToast.show('Errore di rete durante arresto totale', 'error');
                }
            });
        }
        
        // ==================== GESTIONE BANNER E OVERLAY GLOBALI ====================
        
        // Gestione dinamica dell'altezza del banner
        function updateBannerHeight() {
            const banner = document.getElementById('program-status-banner');
            if (banner && banner.classList.contains('visible')) {
                const height = banner.offsetHeight;
                document.documentElement.style.setProperty('--banner-height', height + 'px');
                document.body.classList.add('has-banner');
            } else {
                document.documentElement.style.setProperty('--banner-height', '0px');
                document.body.classList.remove('has-banner');
            }
        }
        
        // Gestione overlay globale
        function showGlobalOverlay() {
            const overlay = document.getElementById('global-program-overlay');
            if (overlay) {
                overlay.classList.add('visible');
                document.body.classList.add('program-running');
                
                // Forza un aggiornamento immediato per mostrare subito le zone
                setTimeout(() => {
                    if (window.IrrigationStatus && window.IrrigationStatus.lastProgramState) {
                        window.lastOverlayUpdate = 0; // Reset throttling
                        updateOverlayContent(window.IrrigationStatus.lastProgramState);
                    }
                }, 100);
            }
        }
        
        function hideGlobalOverlay() {
            const overlay = document.getElementById('global-program-overlay');
            if (overlay) {
                overlay.classList.remove('visible');
                document.body.classList.remove('program-running');
            }
            
            // Reset del pulsante stop
            const stopButton = document.getElementById('overlay-stop-button');
            if (stopButton) {
                stopButton.classList.remove('loading');
            }
        }
        
        // Listener per aggiornamenti dello stato del programma
        document.addEventListener('programStatusChanged', function(event) {
            const state = event.detail;
            
            if (state?.program_running && state.current_program_id) {
                showGlobalOverlay();
                updateOverlayContent(state);
            } else {
                hideGlobalOverlay();
            }
        });

        // Funzione ottimizzata per aggiornare il contenuto dell'overlay con tutti gli step
        function updateOverlayContent(state) {
            // Throttling ridotto per smartphone e responsività migliorata
            const now = Date.now();
            const isMobile = window.innerWidth <= 768;
            const throttleTime = isMobile ? 1000 : 1500; // Ancora più frequente su mobile
            
            if (window.lastOverlayUpdate && (now - window.lastOverlayUpdate) < throttleTime) {
                return;
            }
            window.lastOverlayUpdate = now;
            
            const i18n = window.IrrigationI18n;
            const t = i18n ? i18n.translate : (key, fallback) => fallback || key;
            
            // Aggiorna nome programma
            updateProgramName(state, t);
            
            // Carica e aggiorna gli step del programma
            updateProgramSteps(state, t);
            
            // Aggiorna progresso complessivo
            updateOverallProgress(state);
        }
        
        // Funzione per aggiornare il nome del programma
        function updateProgramName(state, t) {
            const programNameEl = document.getElementById('overlay-program-name');
            if (!programNameEl || !state.current_program_id) return;
            
            if (window.IrrigationApp?.programsData && window.IrrigationApp.programsData[state.current_program_id]) {
                const program = window.IrrigationApp.programsData[state.current_program_id];
                programNameEl.textContent = program.name || t('programs.unnamedProgram', 'Programma');
            } else {
                programNameEl.textContent = t('overlay.loadingProgram', 'Caricamento...');
                
                // Carica i dati del programma se non disponibili
                if (window.IrrigationAPI?.loadPrograms) {
                    window.IrrigationAPI.loadPrograms().then(programs => {
                        if (programs && programs[state.current_program_id]) {
                            const program = programs[state.current_program_id];
                            programNameEl.textContent = program.name || t('programs.unnamedProgram', 'Programma');
                            // Aggiorna anche gli step ora che abbiamo i dati
                            updateProgramSteps(state, t);
                        }
                    }).catch(() => {
                        programNameEl.textContent = t('programs.unnamedProgram', 'Programma');
                    });
                }
            }
        }
        
        // Funzione per aggiornare gli step del programma
        function updateProgramSteps(state, t) {
            const stepsContainer = document.getElementById('overlay-steps-container');
            if (!stepsContainer || !state.current_program_id) return;
            
            const programData = window.IrrigationApp?.programsData?.[state.current_program_id];
            if (!programData?.steps) {
                stepsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:var(--color-text-muted);">' + 
                    t('overlay.noStepsData', 'Caricamento dati programma...') + '</div>';
                return;
            }
            
            const activeZoneId = state.active_zone?.id;
            const activeZoneRemaining = state.active_zone?.remaining_time || 0;
            
            // Trova l'indice dello step attivo
            const activeStepIndex = programData.steps.findIndex(step => parseInt(step.zone_id) === parseInt(activeZoneId));
            
            stepsContainer.innerHTML = '';
            
            programData.steps.forEach((step, index) => {
                const stepEl = createStepElement(step, index, activeStepIndex, activeZoneRemaining, t);
                stepsContainer.appendChild(stepEl);
            });
            
            // Aggiorna statistiche
            updateProgressStats(programData.steps, activeStepIndex, t);
        }
        
        // Funzione per creare un elemento step
        function createStepElement(step, index, activeIndex, activeZoneRemaining, t) {
            const stepEl = document.createElement('div');
            stepEl.className = 'program-step';
            
            const isActive = index === activeIndex;
            const isCompleted = index < activeIndex;
            const isPending = index > activeIndex;
            
            if (isActive) stepEl.classList.add('active');
            else if (isCompleted) stepEl.classList.add('completed');
            else stepEl.classList.add('pending');
            
            const zoneId = parseInt(step.zone_id);
            const zoneName = getZoneName(zoneId, t);
            const duration = step.duration || 0;
            
            // Calcola il progresso dello step
            let progressPercent = 0;
            let timeDisplay = '--:--';
            
            if (isCompleted) {
                progressPercent = 100;
                timeDisplay = '✓';
            } else if (isActive && activeZoneRemaining >= 0) {
                const totalSeconds = duration * 60;
                const elapsed = totalSeconds - activeZoneRemaining;
                progressPercent = Math.min(100, Math.max(0, (elapsed / totalSeconds) * 100));
                
                const minutes = Math.floor(activeZoneRemaining / 60);
                const seconds = activeZoneRemaining % 60;
                timeDisplay = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            } else if (isPending) {
                const minutes = Math.floor(duration);
                const seconds = (duration % 1) * 60;
                timeDisplay = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
            
            stepEl.innerHTML = `
                <div class="step-info">
                    <div class="step-status-indicator ${isActive ? 'active' : isCompleted ? 'completed' : 'pending'}"></div>
                    <div class="step-details">
                        <div class="step-zone-name">${zoneName}</div>
                        <div class="step-duration">${duration} min</div>
                    </div>
                </div>
                <div class="step-progress">
                    <div class="step-timer ${isActive ? 'active' : ''}">${timeDisplay}</div>
                    <div class="step-progress-bar">
                        <div class="step-progress-fill ${isActive ? 'active' : ''}" style="width: ${progressPercent}%;"></div>
                    </div>
                </div>
            `;
            
            return stepEl;
        }
        
        // Funzione per ottenere il nome della zona
        function getZoneName(zoneId, t) {
            const userData = window.IrrigationApp?.userData;
            if (userData?.zones && userData.zones[zoneId] && userData.zones[zoneId].name) {
                return userData.zones[zoneId].name;
            }
            return t('manual.zone', 'Zona ') + (zoneId + 1);
        }
        
        // Funzione per aggiornare le statistiche del progresso
        function updateProgressStats(steps, activeIndex, t) {
            const currentStepEl = document.getElementById('overlay-current-step');
            const totalTimeEl = document.getElementById('overlay-total-time');
            
            if (currentStepEl) {
                const current = Math.max(1, activeIndex + 1);
                const total = steps.length;
                currentStepEl.textContent = `Step ${current}/${total}`;
            }
            
            if (totalTimeEl) {
                const totalMinutes = steps.reduce((sum, step) => sum + (step.duration || 0), 0);
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                
                let timeText = '';
                if (hours > 0) {
                    timeText = `${hours}h ${minutes}min`;
                } else {
                    timeText = `${minutes}min`;
                }
                
                totalTimeEl.textContent = t('overlay.totalTime', 'Tempo totale: ') + timeText;
            }
        }

        // Funzione ottimizzata per calcolare il progresso complessivo del programma
        function updateOverallProgress(state) {
            const progressBarEl = document.getElementById('overlay-progress-bar');
            const progressTextEl = document.getElementById('overlay-progress-text');
            
            if (!progressBarEl || !progressTextEl) return;
            
            let progressPercentage = 0;
            
            // Se non c'è un programma attivo, mostra 0%
            if (!state?.current_program_id || !state?.active_zone) {
                progressBarEl.style.width = '0%';
                progressTextEl.textContent = '0%';
                return;
            }
            
            const programData = window.IrrigationApp?.programsData?.[state.current_program_id];
            if (!programData?.steps || programData.steps.length === 0) {
                progressBarEl.style.width = '0%';
                progressTextEl.textContent = '0%';
                return;
            }
            
            const activeZoneId = parseInt(state.active_zone.id);
            const activeZoneRemaining = state.active_zone.remaining_time || 0;
            
            // Trova l'indice dello step attivo
            const activeStepIndex = programData.steps.findIndex(step => 
                parseInt(step.zone_id) === activeZoneId
            );
            
            if (activeStepIndex === -1) {
                // Zona attiva non trovata negli step, fallback
                progressBarEl.style.width = '0%';
                progressTextEl.textContent = '0%';
                return;
            }
            
            // Calcola il tempo totale di tutti gli step
            const totalDuration = programData.steps.reduce((sum, step) => sum + (step.duration || 0), 0);
            
            if (totalDuration === 0) {
                progressBarEl.style.width = '0%';
                progressTextEl.textContent = '0%';
                return;
            }
            
            // Calcola il tempo trascorso:
            // 1. Somma la durata di tutti gli step completati
            let elapsedTime = 0;
            for (let i = 0; i < activeStepIndex; i++) {
                elapsedTime += programData.steps[i].duration || 0;
            }
            
            // 2. Aggiungi il tempo trascorso nello step corrente
            const currentStepDuration = programData.steps[activeStepIndex].duration || 0;
            const currentStepElapsed = currentStepDuration - (activeZoneRemaining / 60); // converti in minuti
            elapsedTime += Math.max(0, currentStepElapsed);
            
            // Calcola la percentuale complessiva
            progressPercentage = Math.min(100, Math.max(0, (elapsedTime / totalDuration) * 100));
            
            // Aggiorna l'interfaccia con animazione fluida
            progressBarEl.style.width = `${progressPercentage.toFixed(1)}%`;
            progressTextEl.textContent = `${Math.round(progressPercentage)}%`;
        }
        
        // Observer per il banner
        const bannerObserver = new MutationObserver(updateBannerHeight);
        const banner = document.getElementById('program-status-banner');
        if (banner) {
            bannerObserver.observe(banner, { attributes: true, attributeFilter: ['class'] });
        }
        
        // Gestione navigazione
		document.addEventListener('DOMContentLoaded', function() {
			const contentWrapper = document.getElementById('content')?.querySelector('.page-content-wrapper');
			
			document.querySelectorAll('.bottom-nav-item[data-page]').forEach(item => {
				item.addEventListener('click', function(e) {
					e.preventDefault();
					
					// Se un programma è in esecuzione, non permettere la navigazione
					if (document.body.classList.contains('program-running')) {
						return;
					}
					
					const targetPage = this.getAttribute('data-page');
					
					const loadPageFn = function(page) {
						if (window.IrrigationRouter && window.IrrigationRouter.loadPage) {
							window.IrrigationRouter.loadPage(page);
						} else if (typeof window.loadPage === 'function') { 
							window.loadPage(page);
						} else if (typeof window.emergencyLoadPage === 'function') { 
							window.emergencyLoadPage(page);
						} else {
							console.error('Nessun metodo disponibile per caricare:', page);
							window.location.hash = page.replace('.html', '');
						}
					};
					
					if (!window.IrrigationRouter) { 
						console.log("Router non ancora disponibile, attendo...");
						setTimeout(() => loadPageFn(targetPage), 500); 
					} else {
						loadPageFn(targetPage);
					}
				});
			});
			
			const checkAndLoadDefault = function() {
				if (contentWrapper && contentWrapper.firstElementChild?.classList.contains('loading-indicator')) {
					console.log("Script in main.html: Tentativo caricamento pagina di default (manual.html) se non già in corso.");
					
					if (window.IrrigationRouter && window.IrrigationRouter.loadPage && !window.IrrigationApp.isLoadingPage) {
                        if (!window.IrrigationApp.currentPage || window.IrrigationApp.currentPage === "loading") {
						    window.IrrigationRouter.loadPage('manual.html', null, true); 
                        }
					} else {
						console.log("Script in main.html: Router non ancora disponibile o caricamento in corso, attendo scripts.js");
					}
				}
			};
			
			setTimeout(function() {
				if (contentWrapper && contentWrapper.firstElementChild?.classList.contains('loading-indicator') && 
                    (!window.IrrigationApp || !window.IrrigationApp.isLoadingPage) ) {
					console.warn("Script in main.html: Ancora in caricamento dopo 2 secondi, forzo controllo.");
					checkAndLoadDefault(); 
				}
			}, 2000);
            
            // Inizializza l'observer per il ridimensionamento
            window.addEventListener('resize', updateBannerHeight);
            updateBannerHeight(); // Chiamata iniziale
		});
		
		// Gestione tastiera per accessibilità
		document.addEventListener('keydown', function(e) {
			// ESC per chiudere l'overlay se un programma è in esecuzione
			if (e.key === 'Escape' && document.body.classList.contains('program-running')) {
				// Evidenzia il pulsante STOP nell'overlay
				const stopBtn = document.getElementById('overlay-stop-button');
				if (stopBtn) {
					stopBtn.focus();
					stopBtn.style.animation = 'none';
					stopBtn.offsetHeight; // Trigger reflow
					stopBtn.style.animation = 'overlayIconPulse 0.5s ease-in-out 3';
				}
			}
		});
        
        // Esponi le funzioni globalmente per compatibilità
        window.updateOverlayContent = updateOverlayContent;
        window.showGlobalOverlay = showGlobalOverlay;
        window.hideGlobalOverlay = hideGlobalOverlay;
        window.updateBannerHeight = updateBannerHeight;
    </script>
</body>
</html>
